<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Không nạp font/script từ CDN: font tự host qua @fontsource (agents.md mục 0.9, 3.2) -->
    <meta name="color-scheme" content="dark light" />
    <!-- Chống nháy: đặt class chủ đề lên <html> TRƯỚC lần vẽ đầu tiên.
         Nếu chờ React mount mới set, người dùng đã chọn sáng sẽ thấy một nháy
         tối. Script là file NGOÀI, không phải inline: CSP của server không khai
         báo `script-src` nên kế thừa `default-src 'self'` và chặn inline
         script (xem crates/bean-web/src/server.rs). Script thường trong <head>
         chặn render, nên chắc chắn chạy xong trước lần vẽ đầu.
         Hằng số phải khớp THEME_STORAGE_KEY / DEFAULT_THEME ở src/lib/theme.tsx. -->
    <script src="/theme-init.js"></script>
    <!-- PWA (docs/decisions.md mục "PWA"): manifest + sw.js cùng là file tĩnh
         thường trong public/, phục vụ đúng quy tắc no-cache của mục 11.3.
         theme-color mặc định khớp --surface tối; lib/theme.tsx đổi theo chủ đề
         ngay khi người dùng bấm chuyển sáng/tối. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bean" />
    <!-- Favicon là **ảnh badge PNG** (`bean-avatar-sm.png`, sinh từ `brand/bean.png`
         bằng `pnpm brand`) — đúng hình với avatar trong app, không có bản vector
         riêng để lệch. Icon màn hình chính iOS cần đúng 180×180 nên khai riêng. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/bean-avatar-sm.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Bean</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
