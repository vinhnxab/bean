# Task eval 3 — learning loop / reflection (K17 + K16): run thành công với đủ 5 tool
# call ⇒ reflection gọi LLM một lượt riêng và lưu đề xuất ở **trạng thái chờ**;
# lượt kế tiếp trung tính của cùng phiên mới thăng hạng thành skill nháp
# (`followup_prompt` — K16 phương án (b)).
#
# Với FakeProvider: chứng minh máy eval bắt được vòng reflection trì hoãn end-to-end
# (run → Final → candidate → lượt kế không tiêu cực → draft → notification) và
# draft KHÔNG tự kích hoạt. Với `--provider real`: kiểm chứng K17 — model thật có
# trả đúng JSON schema, chấp nhận fenced JSON, tạo SKILL.md hợp lệ hay không.
id = "fake_reflection_skill_draft"
description = "Run 5 lần read_file ⇒ reflection lưu candidate; lượt kế tiếp trung tính thăng hạng thành skill nháp 'release-checklist' (K16)."
prompt = "Đọc ghi chú quy trình release trong notes.md thật kỹ (đọc lại vài lần cho chắc) rồi xác nhận với tôi."
followup_prompt = "Tóm tắt lại quy trình release cho tôi."
max_steps = 6
timeout_seconds = 60

[llm]
script = """
{"responses":[
 {"tool_calls":[
  {"id":"c1","name":"read_file","args":{"path":"notes.md"}},
  {"id":"c2","name":"read_file","args":{"path":"notes.md"}},
  {"id":"c3","name":"read_file","args":{"path":"notes.md"}},
  {"id":"c4","name":"read_file","args":{"path":"notes.md"}},
  {"id":"c5","name":"read_file","args":{"path":"notes.md"}}
 ],"stop":"tool_use"},
 {"text":"Đã nắm quy trình release: make check, tag phiên bản, đẩy artifact. Sẵn sàng khi bạn cần.","stop":"end_turn"},
 {"text":"{\\"reusable\\": true, \\"proposal\\": {\\"kind\\": \\"new\\", \\"name\\": \\"release-checklist\\", \\"description\\": \\"Dùng khi cần phát hành phiên bản mới của một dự án.\\", \\"body\\": \\"# Release checklist\\\\n\\\\n1. make check.\\\\n2. Tag phiên bản.\\\\n3. Đẩy artifact kèm SHA256SUMS.\\", \\"reason\\": \\"Run đọc lại quy trình nhiều bước và kết thúc thành công.\\"}}","stop":"end_turn"},
 {"text":"Quy trình release gồm 3 bước: (1) make check, (2) tag phiên bản, (3) đẩy artifact kèm SHA256SUMS.","stop":"end_turn"}
]}
"""

[setup.files]
"notes.md" = "# Quy trình release\n1. Chạy make check.\n2. Tag phiên bản.\n3. Đẩy artifact kèm SHA256SUMS.\n"

[assert]
end_reason = "final"
tools_called = ["read_file"]
min_tool_calls = 5
draft_created = true
final_contains = ["release"]
