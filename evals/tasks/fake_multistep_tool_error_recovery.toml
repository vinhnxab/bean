# Task eval — tự phục hồi sau lỗi tool (FakeProvider).
#
# Lần gọi đầu dùng tên file **sai** → tool trả lỗi (`is_error`) → model phải
# đổi cách (glob xem tên thật) rồi mới đọc được, thay vì lặp lại y nguyên lần
# gọi vừa hỏng (quy tắc chống lặp, agents.md mục 6). Đây là số đo hành vi
# "đọc lỗi → điều chỉnh" mà mọi agent tốt cần; không có nó thì cải tiến prompt
#/tool description chỉ là đoán mò về mặt chống giòn.
id = "fake_multistep_tool_error_recovery"
description = "read_file tên sai → tool lỗi → glob tìm tên thật → đọc đúng → trả lời; chứng minh vòng lặp sống sau lỗi tool."
prompt = "Đọc báo cáo tháng 11 trong thư mục reports và cho tôi biết doanh thu tháng 11 là bao nhiêu."
max_steps = 8
timeout_seconds = 60

[llm]
script = """
{"responses":[
 {"tool_calls":[{"id":"c1","name":"read_file","args":{"path":"reports/bao_cao_thang_11.md"}}],"stop":"tool_use"},
 {"tool_calls":[{"id":"c2","name":"glob","args":{"pattern":"reports/*.md"}}],"stop":"tool_use"},
 {"tool_calls":[{"id":"c3","name":"read_file","args":{"path":"reports/bao-cao-11.md"}}],"stop":"tool_use"},
 {"text":"Doanh thu tháng 11 đạt 318 triệu đồng (theo reports/bao-cao-11.md).","stop":"end_turn"}
]}
"""

[setup.files]
"reports/bao-cao-11.md" = "Bao cao thang 11: doanh thu dat 318 trieu dong, loi nhuan 57 trieu.\n"
"reports/bao-cao-10.md" = "Bao cao thang 10: doanh thu dat 291 trieu dong.\n"

[assert]
end_reason = "final"
tool_sequence = ["read_file", "glob", "read_file"]
min_tool_calls = 3
max_tool_calls = 3
tools_forbidden = ["write_file"]
final_contains = ["318 triệu"]
