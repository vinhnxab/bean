[workspace]
resolver = "2"
members = [
  "crates/BeanAgent",
  "crates/beanagent-billing",
  "crates/beanagent-channels",
  "crates/beanagent-core",
  "crates/beanagent-llm",
  "crates/beanagent-memory",
  "crates/beanagent-security",
  "crates/beanagent-skills",
  "crates/beanagent-tools",
  "crates/beanagent-types",
  "crates/beanagent-mcp-test-server",
  "crates/beanagent-web",
]
# `default-members` để `cargo build --no-default-features` (bản headless, không UI)
# chỉ áp dụng cho binary `BeanAgent` — xem agents.md mục 2 và 3.3.
default-members = ["crates/BeanAgent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: ts-rs 12 / rmcp 3.4 / libsqlite3-sys 0.38 đều yêu cầu 1.88.
rust-version = "1.88"
license = "MIT"
authors = ["BeanAgent contributors"]
description = "Personal AI agent tự host: một binary Rust (CLI + web + Telegram)"
publish = false

[workspace.lints.rust]
# agents.md mục 0.8: không panic trong code không phải test (clippy/rustc bật ở mức deny)
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[workspace.dependencies]
# --- crate nội bộ ---
beanagent-types = { path = "crates/beanagent-types" }
beanagent-billing = { path = "crates/beanagent-billing" }
beanagent-llm = { path = "crates/beanagent-llm" }
beanagent-security = { path = "crates/beanagent-security" }
beanagent-tools = { path = "crates/beanagent-tools" }
beanagent-memory = { path = "crates/beanagent-memory" }
beanagent-skills = { path = "crates/beanagent-skills" }
beanagent-core = { path = "crates/beanagent-core" }
beanagent-channels = { path = "crates/beanagent-channels" }
beanagent-web = { path = "crates/beanagent-web" }

# --- ngoài (phiên bản đã xác nhận 2026-09-21 qua crates.io/docs.rs) ---
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace", "set-header", "limit"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
argon2 = "0.6.0"
sha2 = "0.11.0"
subtle = "2.6.1"
rpassword = "7.5.4"
futures-core = "0.3.31"
futures-util = "0.3.31"
http-body-util = "0.1.5"
mime_guess = "2.0.5"
tokio-tungstenite = "0.30.0"

# Telegram long polling (teloxide 0.17; Rustls, không OpenSSL).
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }

anyhow = "1.0.104"
async-trait = "0.1.89"
clap = { version = "4.6.7", features = ["derive", "env"] }
rustyline = "18.0.1"
# HTTP client — reqwest 0.13: rustls là backend mặc định (không OpenSSL); `json` cho `.json()`.
reqwest = { version = "0.13.5", features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
# HTML -> text sạch cho `web_fetch` (M7); API nguồn `html2text::from_read` 0.17.1.
html2text = "0.17.1"
url = "2.5.8"

serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
  "fs",
  "io-util",
  "io-std",
  "process",
] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
# Mock HTTP server cho test provider (M2).
wiremock = "0.6.5"

# --- M3: tools + agent loop (phiên bản đã xác nhận qua index.crates.io 2026-09-21) ---
# JSON Schema cho tool: derive từ struct tham số; doc comment thành description (mục 7.1).
schemars = "1.2.2"
# CancellationToken cho huỷ run giữa chừng (mục 6).
tokio-util = "0.7.19"
# Glob matching cho tool `glob` (`**` hiểu đúng ranh giới `/`).
globset = "0.4.20"
# CSPRNG của OS cho RunId/ConfirmId; API `getrandom::fill` đã kiểm tra trong source 0.3.4.
getrandom = "0.3.4"
# Duyệt cây thư mục cho `glob`/`grep`.
walkdir = "2.5.0"
# Pattern regex cho tool `grep`.
regex = "1.13.1"
# RFC3339 timestamps + "Current time" trong system prompt (mục 19).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Cron parser cho REST metadata và scheduler M13.
croner = "4.0.0"
# IANA timezone database để parse cron theo agent.timezone.
chrono-tz = "0.10.4"

# --- M4: security (phiên bản đã xác nhận qua index.crates.io 2026-09-22) ---
# Path jail (mục 15.1): cap-std dùng openat2 RESOLVE_BENEATH trên Linux (fallback đi từng
# component với O_NOFOLLOW) — symlink trỏ ra ngoài Dir luôn là lỗi. Đã xác nhận từ README
# và source cap-std 4.0.3: "cap-std supports symlinks as long as they remain within the sandbox",
# "Accessing a symlink to an absolute path within a Dir is always an error".
cap-std = "4.0.3"
# Property-based test cho path jail (mục 15.1/20) — chỉ dev-dependency.
proptest = "1.11.0"
# MCP client chính thức (M14). Chỉ bật stdio client, không kéo server/macros/HTTP.
# API đã đối chiếu source rmcp 3.4.1 trong cargo registry.
rmcp = { version = "3.4.0", default-features = false, features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
strip = true
