[package]
name = "bean-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Speech-to-text và text-to-speech cho push-to-talk (M27): local (whisper + piper) hoặc ElevenLabs"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bean-types.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util", "fs", "rt"] }
tokio-util.workspace = true
# File tạm cho audio input/output khi chạy whisper-cli/piper (chế độ local).
tempfile.workspace = true
tracing.workspace = true
# `multipart` cho ElevenLabs STT (upload file); `json` cho TTS và parse response.
reqwest = { workspace = true, features = ["json", "multipart"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
wiremock.workspace = true
