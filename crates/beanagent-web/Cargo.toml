[package]
name = "beanagent-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Web server (axum): auth, REST, WebSocket, phục vụ UI nhúng"

[lints]
workspace = true

[features]
default = []
# `ui`: nhúng web/dist vào binary bằng rust-embed (cài ở M9).
ui = ["dep:rust-embed"]

[dependencies]
axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
ts-rs.workspace = true
argon2.workspace = true
sha2.workspace = true
subtle.workspace = true
futures-util.workspace = true
beanagent-llm.workspace = true
beanagent-types.workspace = true
beanagent-core.workspace = true
beanagent-memory.workspace = true
beanagent-skills.workspace = true
beanagent-security.workspace = true
beanagent-tools.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
getrandom.workspace = true
mime_guess.workspace = true
url.workspace = true
rust-embed = { workspace = true, optional = true }

[dev-dependencies]
http-body-util.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
tempfile.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
