# Bean — CI kiểm tra chất lượng (bổ sung cho release.yml của M30)
#
# `make check` (check-rust + check-web) chạy trên mọi push/PR; `make audit`
# soi lỗ hổng dependency. Job eval chạy đúng đường CLI thật (`bean eval run`)
# trên bộ task FakeProvider — xác định và miễn phí, là vạch chuẩn bắt lệch
# hành vi agent (đã có test trong check-rust, còn job này chấm cả CLI + báo cáo).
#
# Test cần Docker (sandbox) tự bỏ qua khi runner không có Docker — không cần
# cấu hình thêm (K22).

name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: check-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # rust-embed nhúng web/dist lúc COMPILE — phải build UI trước cargo.
      - name: Build UI (web/dist)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # K33: CI phải chạy đúng pin `rust-toolchain.toml` — `dtolnay@stable` set
      # `RUSTUP_TOOLCHAIN=stable` đè pin của repo, bản stable mới (~6 tuần/lần)
      # thêm lint mới thì CI đỏ bất ngờ (đã xảy ra ở `fe02c82`). Đọc pin từ file
      # rồi cài đúng bản đó; component khai tại đây vì cài toolchain theo pin.
      - name: Đọc pin toolchain từ rust-toolchain.toml
        id: rustpin
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rustpin.outputs.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: make check-rust
        run: |
          set -o pipefail
          make check-rust 2>&1 | tee check-rust.log

      # Flake đã lặp 2 lần (2026-11-09, 2026-11-10) mà log job cần đăng nhập mới đọc
      # được. In dòng lỗi vào annotations (::error::) — hiển thị ngay trên trang run,
      # không cần đăng nhập — để bắt đúng test flaky thay vì fix mù.
      # `-A 3` kèm 3 dòng sau panic để thấy nội dung assert (vĩ `stdout:` của test CLI
      # — flake lần 3 `61d5080` bị cắt mất phần này nên không chẩn đoán được).
      # K33: `CARGO_TERM_COLOR: always` bọc ANSI khiến grep `^error:` không khớp —
      # strip escape trước khi grep (đã khiến run `58e126e` đỏ mà không thấy lỗi).
      - name: Tóm tắt test fail ra annotations
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' check-rust.log \
            | grep -E "panicked at|test result: FAILED|^error(\[|:)|failures:" -A 3 \
            | head -60 \
            | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

  web:
    name: check-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: make check-web
        run: |
          set -o pipefail
          make check-web 2>&1 | tee check-web.log

      # Flake TasksPage đã lặp 2 lần (2026-11-10) — in test fail + vài dòng kề
      # (diff assertion) ra annotations để chẩn đoán không cần đăng nhập.
      - name: Tóm tắt test fail ra annotations
        if: failure()
        run: |
          grep -E "FAIL |✗|AssertionError|Expected|Received" -A 6 check-web.log \
            | head -60 \
            | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

  eval:
    name: eval baseline (fake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build UI (web/dist)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Đọc pin toolchain từ rust-toolchain.toml (K33)
        id: rustpin-eval
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rustpin-eval.outputs.toolchain }}

      - uses: Swatinem/rust-cache@v2

      # Mã thoát khác 0 khi có task fail — vạch chuẩn eval là cổng CI.
      - name: bean eval run --provider fake
        run: cargo run --locked -p bean -- eval run --provider fake

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Đọc pin toolchain từ rust-toolchain.toml (K33)
        id: rustpin-audit
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rustpin-audit.outputs.toolchain }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: make audit
        run: make audit
