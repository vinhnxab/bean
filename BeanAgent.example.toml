# BeanAgent — cấu hình mẫu (agents.md mục 18)
# Sao chép thành `BeanAgent.toml` rồi sửa theo nhu cầu:
#     cp BeanAgent.example.toml BeanAgent.toml
#
# QUY TẮC: KHÔNG bao giờ ghi secret vào file này. Mọi secret đọc từ biến môi trường
# theo trường *_env (ví dụ ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN).

[agent]
workspace = "./workspace"
max_steps = 25
context_budget_tokens = 100000
timezone = "Asia/Ho_Chi_Minh"
# Lớp kiểm tra thứ hai ở lõi, ngoài allowlist của từng kênh (mục 10).
allowed_users = ["web:admin", "cli:local", "telegram:123456789"]
# M21 — map user identity -> tên role trong [[roles]].
# Bỏ trống (mặc định) ⇒ RBAC TẮT, mọi user trong allowed_users thấy mọi tool như cũ.
# Có bất kỳ dòng nào ⇒ RBAC BẬT, user KHÔNG có trong đây sẽ là `no-access`
# (không thấy tool nào, kể cả tool an toàn). Đây là hành vi an toàn mặc định.
#
# [agent.user_roles]
# "web:admin" = "admin"
# "telegram:123456789" = "developer"

[data]
dir = "~/.BeanAgent"                 # sqlite, audit log, auth.toml

[llm]
provider = "anthropic"               # anthropic | openai_compat
model = "claude-sonnet-5"            # đổi tuỳ ý
allowed_models = ["claude-sonnet-5"]
api_key_env = "ANTHROPIC_API_KEY"
# base_url = "http://localhost:11434/v1"   # cho openai_compat / Ollama
max_tokens = 4096

[tools]
# Nhóm `browser` chỉ có tác dụng khi `[browser].enabled = true` (mặc định tắt).
enabled = ["files", "shell", "web", "memory", "skills", "schedule", "billing", "browser"]

# ---------------------------------------------------------------------------
# M26 — Tool browser nội bộ: nói thẳng Chrome DevTools Protocol qua crate Rust
# `chromiumoxide`. KHÔNG qua MCP, KHÔNG qua npm, không cần Node ở đâu cả.
# ---------------------------------------------------------------------------

[browser]
enabled = false

# Chrome/Chromium PHẢI CÀI SẴN. Bean không bao giờ tải Chrome lúc chạy.
# Rỗng => tự phát hiện theo thứ tự: biến môi trường `CHROME` -> tên binary trong PATH
# (`google-chrome`, `chromium`, ...) -> đường dẫn cố định `/opt/google/chrome`.
# Không tìm thấy thì tool báo lỗi rõ ràng, không tải thay.
# executable_path = "/usr/bin/google-chrome"

# Origin được phép chạy tool HÀNH ĐỘNG ở mức `Confirm` (có "cho phép trong phiên").
# Origin NGOÀI danh sách này luôn là `Dangerous` — không có tuỳ chọn "trong phiên".
#
# Wildcard khớp THEO RANH GIỚI LABEL, không theo hậu tố chuỗi:
#   `https://*.dev.internal`  khớp  `api.dev.internal`   ✓
#   `https://*.dev.internal`  khớp  `dev.internal.attacker.com`  ✗ (domain giả dạng)
# Scheme và port phải khớp tuyệt đối: không bao giờ hạ https xuống http, và không ghi
# port nghĩa là CHỈ khớp port mặc định của scheme (80/443), không phải "mọi port".
#
# Rỗng KHÔNG có nghĩa "cho phép tất cả" — mọi origin ngoài whitelist vẫn `Dangerous`.
# allowed_origins = ["http://localhost:3000", "https://*.dev.internal"]

headless = true
# Idle quá hạn thì tự tắt Chrome để giải phóng vài trăm MB RAM. 0 = không tự tắt.
idle_timeout_seconds = 300
launch_timeout_seconds = 30
# Trần kích thước một lần chụp (byte). Ảnh vượt ngưỡng bị từ chối kèm thông điệp rõ
# ràng, thay vì âm thầm làm lịch sử phình.
max_image_bytes = 4194304

# Phân quyền: nhóm ĐỌC cần tag `dev-read` HOẶC `test-run` (Developer lẫn QA);
# nhóm HÀNH ĐỘNG cần tag `test-run` — CHỈ role QA. `browser_evaluate_script` luôn
# `Dangerous` kể cả origin trong whitelist (chạy JS tuỳ ý ≈ thực thi mã).

[learning]
enabled = true
min_tool_calls = 5
proposal_interval_minutes = 60

# ---------------------------------------------------------------------------
# M21 — RBAC. Bật/tắt phụ thuộc `agent.user_roles` ở trên, KHÔNG phụ thuộc `[[roles]]`:
#   * `agent.user_roles` rỗng  ⇒ RBAC TẮT, mọi user trong allowed_users thấy mọi tool
#     (đúng hành vi cũ — đây là trạng thái của file mẫu này ngay bây giờ).
#   * `agent.user_roles` có ít nhất 1 dòng ⇒ RBAC BẬT: user được map thì dùng role đó;
#     user KHÔNG có trong map sẽ là `no-access` (không thấy tool nào, kể cả tool an toàn).
# Muốn bật: bỏ comment `[agent.user_roles]` ở trên và gán role cho từng user.
#
# Bảng `[[roles]]` dưới đây luôn được nạp (kể cả khi RBAC tắt) để bạn có sẵn tên tag.
# ---------------------------------------------------------------------------

# Tag `*` = mọi quyền. `forbid_tags` là chốt an toàn ở tầng code: cấp vừa cấm sẽ
# khiến `BeanAgent` không khởi động, nên không thể lỡ tay phá nguyên tắc four-eyes.
[[roles]]
name = "admin"
tool_tags = ["*"]

[[roles]]
name = "it-security"
tool_tags = ["infra-read", "infra-scan"]

# M23 — vai trò trực trật bảo mật. Cần tag `infra-scan` cho BOTH `security_scan` lẫn
# `run_shell` (cùng tag, ngữ nghĩa OR) vì thực tế phải tự chạy lệnh để đối chiếu kết quả
# quét với thực tế máy. Việc này đúng nguyên lý four-eyes: một người vừa đề xuất quét vừa
# tự quét được thì phải là người được giao phần đó, không phải developer/qa.
[[roles]]
name = "security-scan"
tool_tags = ["infra-read", "infra-scan"]

# M22 — Monitor: chỉ đọc log/CVE qua MCP. Gắn server SIEM/CVE với
# `tool_tags = ["infra-read"]` trong `[[mcp_servers]]` để chỉ role này (và it-security)
# thấy được tool đó. M22 KHÔNG thêm tool quét chủ động — chỉ đọc.
#
# Tag `memory-read` (M25) là tag cho tool `memory_query` (đọc `MEMORY.md`/`USER.md`) —
# đây là một trong ba tag được phép expose qua MCP server.
[[roles]]
name = "monitor"
tool_tags = ["infra-read", "memory-read"]

[[roles]]
name = "finance-readonly"
tool_tags = ["billing-read"]
# M22a — domain tài chính TÁCH BIỆT khỏi infra-*. `validate()` từ chối cấu hình
# vừa cấp vừa cấm; thêm `infra-read`/`infra-scan` vào `tool_tags` sẽ không khởi động được.
forbid_tags = ["infra-read", "infra-scan"]

[[roles]]
name = "developer"
tool_tags = ["dev-write"]

[[roles]]
name = "qa"
tool_tags = ["dev-read", "test-run"]
forbid_tags = ["dev-write"]           # four-eyes: agent review không được ghi code
# context_budget_tokens = 200000       # ghi đè agent.context_budget_tokens cho role này
# daily_token_budget = 1000000         # ngân sách token/ngày RIÊNG của role này (M21.7)

# M24 — Marketing. TÁCH BIỆT hoàn toàn khỏi infra/dev/finance.
#
# `allowed_tool_tags` là danh sách TRẮNG: role này chỉ thấy tool mang tag marketing-*
# (rỗng ở role khác = không giới hạn, giữ nguyên hành vi cũ). Nhờ vậy marketing thấy
# `web_fetch`/`web_search` (mở thêm bằng `also_visible_to`) mà KHÔNG thấy `write_file`,
# `run_shell` hay bất kỳ tool `infra-*`/`billing-*` nào.
[[roles]]
name = "marketing"
tool_tags = ["marketing-read", "marketing-draft", "marketing-publish"]
allowed_tool_tags = ["marketing-read", "marketing-draft", "marketing-publish"]

# ---------------------------------------------------------------------------
# M21 — Project profile. `default` là project dự phòng, ánh xạ tới
# agent.workspace; mỗi project có MEMORY.md/USER.md và thư mục làm việc riêng.
# ---------------------------------------------------------------------------
# [[projects]]
# name = "khach-hang-a"
# workspace = "./workspace/khach-hang-a"


# ---------------------------------------------------------------------------
# M22a — Domain tài chính (READ-ONLY). Mặc định TẮT; khi bật mà thiếu `base_url` hoặc
# biến credential thì tool chạy ở CHẾ ĐỘ STUB: không gọi mạng, trả thông báo rõ.
#
# Credential PHẢI là biến RIÊNG, quyền tối thiểu chỉ đọc billing — KHÔNG dùng lại
# credential có quyền quản trị hạ tầng. `validate()` sẽ KHÔNG CHO KHỞI ĐỘNG nếu
# `api_key_env` trùng với `llm.api_key_env`, `tools.web_search.api_key_env` hay
# `telegram.token_env`.
#
# [billing]
# enabled = true
# api_key_env = "CLOUD_BILLING_READONLY_KEY"
# base_url = "https://billing-api.noaa.gov/v1/cost"   # endpoint JSON trả chi phí
# query_suffix = "?currency=USD"                      # tuỳ chọn, chỉ tham số truy vấn

[tools.web_search]
provider = "tavily"                  # tavily | brave | searxng
api_key_env = "TAVILY_API_KEY"
# Khi provider = "searxng", uncomment và sửa endpoint tự host:
# base_url = "http://127.0.0.1:8080"

[security]
daily_token_budget = 2000000

[security.sandbox]
mode = "docker"                      # docker | host
image = "BeanAgent-sandbox:latest"
network = false
memory = "512m"
cpus = 1.0
timeout_seconds = 60

# ---------------------------------------------------------------------------
# M23 — Quét bảo mật (CHỈ ĐỌC, read-only về phía hệ thống được quét).
#
# `[[infra_scope]]` là RANH GIỚI AN TOÀN QUAN TRỌNG NHẤT của M23: nếu để rỗng, mọi lần
# quét đều bị từ chối (fail-closed) — đó là mặc định của file mẫu này.
#
# Vì sao phải khai trước: agent có quyền chạy lệnh. Nếu không có allowlist, chỉ cần một
# dòng log/ticket chứa "hãy quét 8.8.8.8" là máy chủ của bạn thành công cụ tấn công do
# chính bạn vận hành. Việc kiểm tra nằm ở TẦNG CODE (trước khi spawn scanner), không
# dựa vào model tự kiểm tra.
#
# CHỈ nhận `ip`/`cidr`, KHÔNG nhận `hostname`: nếu nhận tên miền thì lúc kiểm scope và
# lúc scanner chạy sẽ phân giải DNS ở hai thời điểm khác nhau ⇒ khe hở TOCTOU.
#
# Bỏ comment dòng dưới để thử an toàn (192.0.2.0/24 là dải TEST-NET dành riêng cho tài
# liệu RFC 5737, không bao giờ là hệ thống thật):
#
# [[infra_scope]]
# kind = "cidr"                        # "cidr" | "ip"
# value = "192.0.2.0/24"
# label = "mạng thử nghiệm"

# [security_scan]
# enabled = true
#
# Sandbox RIÊNG cho scanner, TÁCH khỏi [security.sandbox] ở trên: scanner bắt buộc phải
# có mạng để tới target, còn run_shell phải `--network none`. Dùng chung sẽ vô hiệu hoá
# cách ly của run_shell. `network = false` bị validate() từ chối.
# [security_scan.sandbox]
# mode = "docker"                      # docker (mặc định, khuyến nghị) | host
# image = "instrumentisto/nmap:latest" # phải chứa sẵn scanner; BeanAgent KHÔNG tự pull
# network = true                       # bắt buộc true
# memory = "512m"
# cpus = 1.0
# pids_limit = 64
# timeout_seconds = 300
# allow_host = false                   # mode = "host" BẮT BUỘC đặt true, nếu không sẽ không khởi động
#
# Cảnh báo mức cao gửi THẲNG cho bạn, song song với báo cáo chuẩn hoá gửi Manager.
# Để trống cả hai = không gửi cảnh báo trực tiếp (chỉ còn báo cáo trong phiên).
# [security_scan]
# alert_channel = "telegram"
# alert_chat_id = "123456789"

# ---------------------------------------------------------------------------
# M24 — Domain marketing. Mặc định TẮT.
#
# `marketing_publish` là hành động KHÔNG HOÀN TÁC: nó LUÔN là Dangerous (khai cứng trong
# code, không đọc từ cấu hình) nên không bao giờ có tuỳ chọn "cho phép trong phiên" —
# dù cấu hình có gì. Chỉ nên bật khi bạn thực sự muốn agent đăng thay bạn.
#
# Credential PHẢI là biến RIÊNG, quyền API tối thiểu CHỈ POST — KHÔNG dùng lại key có
# quyền rộng hơn. `validate()` sẽ KHÔNG CHO KHỞI ĐỘNG nếu `api_key_env` trùng với
# `llm.api_key_env`, `tools.web_search.api_key_env` hay `telegram.token_env`.
#
# Bật `enabled` mà thiếu biến credential ⇒ BeanAgent báo lỗi ngay lúc khởi động,
# không âm thầm chạy chế độ stub (khác `billing`, vì đăng bài không hoàn tác được).
#
# [marketing]
# enabled = true
# api_key_env = "MARKETING_POST_ONLY_KEY"
# base_url = "https://api.example-social.com/v2/posts"   # endpoint JSON nhận nội dung
# text_field = "text"                                   # tên trường chứa nội dung

[web]
enabled = true
bind = "127.0.0.1:7878"
public_origin = "http://127.0.0.1:7878"
allow_remote = false
session_ttl_hours = 168
# trust_proxy = false                # bật CHỈ khi chạy sau reverse proxy tin cậy:
                                     # khi đó giới hạn tần suất đăng nhập dùng X-Forwarded-For

[telegram]
enabled = false
token_env = "TELEGRAM_BOT_TOKEN"
allowed_user_ids = [123456789]
rate_limit_per_minute = 20

[[mcp_servers]]
name = "example"
command = "/usr/local/bin/some-mcp-server" # executable; không phải dòng shell
args = []
# env = { APP_MODE = "production" }     # chỉ biến không bí mật; không ghi token vào config
trust = false                           # false => Confirm; true chỉ sau khi audit server
# M22 — tag RBAC áp cho MỌI tool của server này. Bỏ trống (mặc định) ⇒ mọi role đã
# cấp quyền đều thấy, giữ hành vi cũ. Đặt ["infra-read"] cho server SIEM/CVE để chỉ
# role `monitor` / `it-security` thấy tool đó.
tool_tags = []

# call_timeout_seconds: timeout cho MỘT lần gọi tool của server này. Bỏ trỐng => 60s.
#   Cần cho tool chạy lâu thực sự (truy vấn SIEM, xuất báo cáo, quét hạ tầng): bị cắt ở
#   60s sẽ thành tool error *giả*, khiến model tưởng server hỏng rồi thử lại vô ích.
#   Khoảng 1..=3600.
# call_timeout_seconds = 300

# inherit_env: biến môi trường của tiến trình Bean được phép kế thừa cho server này.
#   Mặc định rỗng, và đó là hành vi an toàn (mục 15.6): Bean spawn MCP server với
#   `env_clear()` nên server KHÔNG thấy secret của host. Nhưng `env_clear()` xoá luôn
#   `PATH`, nên server cần `PATH` để chạy sẽ chết ngay — ví dụ wrapper có shebang
#   `#!/usr/bin/env <interpreter>`, thiếu `PATH` thì `env` không tìm thấy trình thông
#   dịch và tiến trình con thoát với status 127 (Bean chỉ log: "không spawn được").
#   Trường này là cách bật lại ĐÚNG những biến cần, thay vì bỏ `env_clear()`. Danh sách
#   trắng; `env` tường minh luôn thắng. Tên có `key`/`token`/`secret`/`password`/
#   `authorization`/`credential` sẽ log cảnh báo (không chặn) để bạn thấy mình đang
#   đưa secret ra ngoài.
inherit_env = []

# M22 — ví dụ server SIEM/CVE chỉ đọc. `command` có thể là `docker run …` để bọc
# server không tin cậy trong container (khuyến nghị cho MCP server công khai).
# [[mcp_servers]]
# name = "siem"
# command = "docker"
# args = ["run", "--rm", "-i", "--network", "none", "ghcr.io/example/siem-mcp:1.0"]
# trust = false
# tool_tags = ["infra-read"]

# ---------------------------------------------------------------------------
# M25 — Bean đóng vai MCP SERVER (read-only) cho Cline/Cursor/OpenCode/Claude Code.
# ---------------------------------------------------------------------------
# Đây là chiều NGƯỢC của `[[mcp_servers]]` ở trên: ở đó Bean là client gọi MCP server khác,
# ở đây Bean là server để agent khác gọi vào.
#
# PHẠM VI CỨNG (không thương lượng): chỉ expose tool mang tag `infra-read`, `billing-read`
# hoặc `memory-read` **và** có `Risk::Safe`. Mọi tool ghi/thực thi (`dev-write`,
# `infra-scan`, `marketing-publish`…) bị chặn ở tầng code, kể cả khi client gắn role
# `admin` có tag `*`. Không có "cho phép trong phiên" vì client MCP không có ai bấm nút.
#
# Cách dùng nhanh:
#   1. Thêm `[[mcp_clients]]` + `mcp-client:<tên>` trong `[agent].user_roles` (bên dưới).
#   2. `BeanAgent auth mcp-token add <tên>`  → in token MỘT LẦN.
#   3. stdio (khuyến nghị, cùng máy): trong Cline/Cursor trỏ command là
#        `BeanAgent mcp serve`  và env `BEANAGENT_MCP_TOKEN=<token>`.
#      HTTP (Bean chạy từ xa): `BeanAgent mcp serve --http`, client gửi
#        header `Authorization: Bearer <token>` tới `POST {public_origin}/mcp`.
#
# Lưu ý an toàn: token là **bí mật dài hạn** nằm trong thư mục dự án của bạn — đừng commit
# nó. Bean chỉ lưu SHA-256 trong `data.dir/beanagent.db`; thu hồi bằng
# `BeanAgent auth mcp-token revoke <tên>`.
[mcp_server]
enabled = false                          # bật tường minh: đây là bề mặt tấn công mới
http_enabled = false                     # true ⇒ thêm streamable-HTTP/SSE cạnh stdio
bind = "127.0.0.1:7879"
public_origin = "http://127.0.0.1:7879"
allow_remote = false                     # bind ngoài loopback ⇒ phải true + reverse proxy TLS
token_ttl_hours = 8760                   # 8760 = 1 năm; 0 = không hết hạn
# allowed_hosts = []                     # thêm `Host` được phép (chống DNS rebinding);
                                          # rỗng ⇒ chỉ nhận Host loopback
#
# K24 — giới hạn tần suất, CHỈ có tác dụng khi `http_enabled = true` (stdio thì token
# nằm trong tiến trình của chính bạn nên không cần). Dùng **cùng** thuật toán khoá với
# `POST /api/auth/login`:
#   * chống dò token: 5 lần xác thực sai / 60 giây (theo cả token lẫn IP), khoá tăng dần
#     tới 300 giây — không cấu hình được, cố ý để luôn giống đăng nhập web;
#   * trần lưu lượng: chống trường hợp token bị lộ rồi bị dùng để quét dữ liệu.
# rate_limit_per_minute = 120            # mỗi token; 0 = tắt (chỉ khi endpoint không
                                          # công khai — http_enabled + 0 sẽ bị validate chặn)
# rate_limit_ip_multiplier = 5           # trần theo IP = trần token × hệ số này;
                                          # 0 = tắt giới hạn theo IP
#
# Nhật ký riêng của MCP nằm ở `data.dir/audit/mcp.jsonl` (ghi **song song** với
# `audit.jsonl`, không thay thế). Dùng để phát hiện lạm dụng mà không phải lọc giữa
# các kênh khác.

# Mỗi client là một danh tính riêng (`mcp-client:<name>`), tách hoàn toàn khỏi
# `telegram:<id>` / `web:admin`: token của client bị lộ KHÔNG biến thành quyền của bạn.
# `role` phải tồn tại trong `[[roles]]` và KHÔNG được là `admin` (validate chặn).
# [[mcp_clients]]
# name = "cline"
# role = "monitor"

